[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-plant-care-system"
version = "0.1.0"
description = "A wheeled robot that maps a space and finds the best location for a plant."
readme = "README.md"
requires-python = ">=3.9"
# Nothing in the Python tree has a third-party import any more: the simulation
# moved to Unity, so pygame went with it. The API's dependencies are optional
# so that working on the Pi code does not pull a web server in.
dependencies = []

[project.optional-dependencies]
# pip install -e ".[api]"      -- to run the API
# pip install -e ".[api,dev]"  -- to run its tests
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2",
]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.setuptools]
# Explicit list rather than auto-discovery: the repo root also holds docs/ and
# simulation/ (the Unity project), neither of which is an importable package.
packages = [
    "api",
    "data",
    "data.environmental_sensors",
    "pi",
    "pi.communication",
    "pi.decision",
    "pi.navigation",
    "pi.plant",
    "pi.robot",
    "pi.sensors",
]
